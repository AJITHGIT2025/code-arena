version: '3.8'

services:
  code-arena:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code_arena_app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=change-this-in-production-super-secret-key-2026
      - JUDGE0_API_URL=https://ce.judge0.com
    volumes:
      - arena-data:/app/server/prisma
    restart: unless-stopped

volumes:
  arena-data:
